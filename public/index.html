<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DP Scan TR</title>

<style>
body {
  font-family: Arial;
  background:#f4f4f4;
  padding:20px;
}

.container {
  max-width:900px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

textarea {
  width:100%;
  height:80px;
}

button {
  padding:10px 15px;
  margin-top:10px;
  cursor:pointer;
}

.card {
  background:#fafafa;
  border:1px solid #ddd;
  padding:10px;
  margin-top:10px;
  white-space:pre-wrap;
}

.error {
  color:red;
}
</style>
</head>

<body>

<div class="container">

<h2>DP Scan → Rapor Görüntüleyici</h2>

<textarea id="url" placeholder="DP Scan link yapıştır"></textarea>

<br>

<button onclick="loadData()">ÇEK</button>
<button onclick="window.print()">PDF YAZDIR</button>

<div id="status"></div>
<div id="output"></div>

</div>

<script>

async function loadData(){

  const url = document.getElementById("url").value;
  const status = document.getElementById("status");
  const output = document.getElementById("output");

  if(!url){
    status.innerHTML = "<span class='error'>URL gir</span>";
    return;
  }

  status.innerHTML = "Yükleniyor...";

  try {

    const res = await fetch("/fetch?url=" + encodeURIComponent(url));
    const data = await res.json();

    if(!data.success){
      status.innerHTML = "<span class='error'>Hata: " + data.error + "</span>";
      return;
    }

    status.innerHTML = "Tamam ✔";

    output.innerHTML = `
      <h3>${data.title}</h3>
      <div class="card">${data.text}</div>
    `;

  } catch(err){
    status.innerHTML = "<span class='error'>Bağlantı hatası</span>";
  }
}

</script>

</body>
</html>
